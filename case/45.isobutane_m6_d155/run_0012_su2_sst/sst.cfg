% SU2 cross-check - case/45 M6 d1.55m nozzle (CPG), axisymmetric RANS-SST
% forge 対応: run_0011_cpg_ns (node, SST wallTreatment0, y+~1.4, Sutherland, Pr 0.72, Prt 0.9)
% 相違点 (意図的): 対流スキーム ROE+MUSCL (forge は SLAU 系) / SST は SU2 標準 V2003m
%   (forge は dilatationCorrection 2 + katoLaunder 1) — 差が出たらここを A/B する
SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
SYSTEM_MEASUREMENTS= SI
AXISYMMETRIC= YES
RESTART_SOL= YES

FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.27354
GAS_CONSTANT= 292.13

VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716e-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4
CONDUCTIVITY_MODEL= CONSTANT_PRANDTL
PRANDTL_LAM= 0.72
PRANDTL_TURB= 0.9

REF_DIMENSIONALIZATION= DIMENSIONAL
INIT_OPTION= TD_CONDITIONS
FREESTREAM_PRESSURE= 3.0e6
FREESTREAM_TEMPERATURE= 1500.0
MACH_NUMBER= 0.15
FREESTREAM_TURBULENCEINTENSITY= 0.01
FREESTREAM_TURB2LAMVISCRATIO= 10.0

INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, 1600.0, 5500000.0, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 1389.0 )
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( axis )

NUM_METHOD_GRAD= GREEN_GAUSS
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_TURB= EULER_IMPLICIT

CFL_NUMBER= 5.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 2.0, 50.0 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1e-4
LINEAR_SOLVER_ITER= 10

ITER= 20000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -12
CONV_STARTITER= 500

MARKER_ANALYZE= ( outlet )
MARKER_ANALYZE_AVERAGE= MASSFLUX

MESH_FORMAT= SU2
MESH_FILENAME= nozzle.su2
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART_ASCII, PARAVIEW )
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE )
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
OUTPUT_WRT_FREQ= 5000
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-Y, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION, CFL_NUMBER, AVG_MASSFLOW )
SCREEN_WRT_FREQ_INNER= 500
HISTORY_OUTPUT= ( ITER, RMS_RES, FLOW_COEFF, CFL_NUMBER )

READ_BINARY_RESTART= NO
SOLUTION_FILENAME= solution_flow
