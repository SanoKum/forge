%% SU2 axisymmetric RANS-SST — case 40 bell nozzle
%% run_0028 fixed-CFL final restart + constant molecular conductivity only

SOLVER= RANS
MATH_PROBLEM= DIRECT
AXISYMMETRIC= YES
SYSTEM_MEASUREMENTS= SI

ITER= 5000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -11
CONV_STARTITER= 10

FLUID_MODEL= STANDARD_AIR
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.058
PRANDTL_LAM= 0.72
VISCOSITY_MODEL= SUTHERLAND
MU_REF= 1.716e-5
MU_T_REF= 273.15
SUTHERLAND_CONSTANT= 110.4

%% run_0028 との差分はこの分子熱伝導率モデルだけ。forge CPG viscMethod:1 と一致させる。
CONDUCTIVITY_MODEL= CONSTANT_CONDUCTIVITY
THERMAL_CONDUCTIVITY_CONSTANT= 0.0257
TURBULENT_CONDUCTIVITY_MODEL= CONSTANT_PRANDTL_TURB
PRANDTL_TURB= 0.90

KIND_TURB_MODEL= SST
FREESTREAM_TURBULENCEINTENSITY= 0.01
FREESTREAM_TURB2LAMVISCRATIO= 10.0

REF_DIMENSIONALIZATION= DIMENSIONAL
INIT_OPTION= TD_CONDITIONS
MACH_NUMBER= 0.10
FREESTREAM_PRESSURE= 20000.0
FREESTREAM_TEMPERATURE= 300.0

CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
TIME_DISCRE_FLOW= EULER_IMPLICIT

CFL_NUMBER= 10.0
CFL_ADAPT= NO

LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 5
MGLEVEL= 0

MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( axis )
INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, 1500.0, 4000000.0, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 20000.0 )

MARKER_PLOTTING= ( wall, axis )
MARKER_MONITORING= ( outlet )
MARKER_ANALYZE= ( outlet )
MARKER_ANALYZE_AVERAGE= MASSFLUX

SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_MOMENTUM-Y, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION )
SCREEN_WRT_FREQ_INNER= 250
HISTORY_WRT_FREQ_INNER= 1

MESH_FORMAT= SU2
MESH_FILENAME= nozzle.su2
TABULAR_FORMAT= CSV
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
OUTPUT_WRT_FREQ= ( 1000, 1000, 1000 )
CONV_FILENAME= history
RESTART_FILENAME= restart_flow
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
VOLUME_OUTPUT= ( COORDINATES, SOLUTION, PRIMITIVE, EDDY_VISCOSITY )
RESTART_SOL= YES
SOLUTION_FILENAME= restart_input.dat
