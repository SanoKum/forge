# forge_design 問題定義 (Phase 0 スモークテスト用 ③ベル)
# 条件は case/29.bell_vs_conical の実績値 (Pt 4 MPa / Tt 1500 K / rt 10 mm) に揃える
name: bell_L9
type: thruster_bell
mode: K
gas: {gamma: 1.4, cp: 1004.5}

spec:
  Pt: 4.0e6          # 入口全圧 [Pa]
  Tt: 1500.0         # 入口全温 [K]
  p_ambient: 20000.0 # 背圧 [Pa] (高空条件・過膨張剥離を避ける)
  r_throat: 0.010    # スロート半径 [m] (閉ループ派生の初期値)
  eps: 9.0           # 面積比 Ae/At

dv:
  theta_a_deg: {value: 20.0, min: 10.0, max: 28.0}
  L_over_rt:   {value: 9.0,  min: 5.0,  max: 12.0}

geometry:
  r_inlet: 2.5
  L_pipe: 0.5
  L_contract: 3.0
  Ru: 1.5
  Rd: 0.4
  phi_u_deg: 25.0
  theta_e_deg: 8.0

mesh:
  ni: 221
  nj: 65
  wall_first_frac: 5.0e-3   # node レシピ準拠 (1e-3 は node 発散: 壁第一セル過細)
  throat_refine: 3.0

evaluate:
  turbulence: sst
  nStepOuter: 12000
  outStepInterval: 4000
  objectives: [eta_cf, length]
