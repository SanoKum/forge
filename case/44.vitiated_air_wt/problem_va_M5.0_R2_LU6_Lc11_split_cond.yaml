# 凝縮の M_d 感度 (同 Pt/Tt/組成/出口径 φ1600、M_d だけ変更 → r_t・p_ambient を等エントロピーで再計算)。R2/L_U6、L_c は設計可能な最小級。tp_species: split_h2o = [MIXDRY, H2O] の 2 種 TP
# (case/42 run_0063–0065 と同じ経路, plans/accepted/tooling-nozzle-tp-split-h2o-condensation.md)。dry (対照) / cond (Kw+HK, condGasSpecies 自動)。
