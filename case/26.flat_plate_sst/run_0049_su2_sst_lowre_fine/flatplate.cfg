% ============================================================================
% case/26 平板 SST — forge node run_0042 と同一メッシュ・同一 BC の SU2 クロスチェック
%   [run_0049] 壁解像 y+0.35 細メッシュ + low-Re。目的: node-centered (median-dual) 離散化そのものが Cf 欠損の原因かを外部ソルバで切り分ける
%   SU2 も vertex-centered median-dual なので、forge node と同じ DOF 配置になる
% ============================================================================
SOLVER= RANS
KIND_TURB_MODEL= SST
MATH_PROBLEM= DIRECT
RESTART_SOL= NO
SYSTEM_MEASUREMENTS= SI

% --- 自由流 (forge: Pt=100000, Tt=288.15, M=0.2 の等エントロピー静的量) ---
MACH_NUMBER= 0.2
AOA= 0.0
FREESTREAM_PRESSURE= 97249.67
FREESTREAM_TEMPERATURE= 285.8631
INIT_OPTION= TD_CONDITIONS
FREESTREAM_OPTION= TEMPERATURE_FS

% --- 流入乱流 (forge: k=0.3, omega=300 と等価) ---
FREESTREAM_TURBULENCEINTENSITY= 0.006598
FREESTREAM_TURB2LAMVISCRATIO= 65.853

% --- 物性 (forge: viscMethod 0 = 定数 mu, thermCond 定数) ---
FLUID_MODEL= IDEAL_GAS
GAMMA_VALUE= 1.4
GAS_CONSTANT= 287.0
VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.8E-5
CONDUCTIVITY_MODEL= CONSTANT_CONDUCTIVITY
THERMAL_CONDUCTIVITY_CONSTANT= 0.0251
PRANDTL_TURB= 0.9

% --- 境界条件 (forge bcondConfig と対応) ---
MARKER_HEATFLUX= ( wall, 0.0 )
MARKER_SYM= ( sym, top )
INLET_TYPE= TOTAL_CONDITIONS
MARKER_INLET= ( inlet, 288.15, 100000.0, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 97249.67 )
MARKER_PLOTTING= ( wall )
MARKER_MONITORING= ( wall )

% --- 数値 ---
NUM_METHOD_GRAD= WEIGHTED_LEAST_SQUARES
CONV_NUM_METHOD_FLOW= ROE
MUSCL_FLOW= YES
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05
CONV_NUM_METHOD_TURB= SCALAR_UPWIND
MUSCL_TURB= NO
TIME_DISCRE_FLOW= EULER_IMPLICIT
TIME_DISCRE_TURB= EULER_IMPLICIT
CFL_NUMBER= 10.0
CFL_ADAPT= YES
CFL_ADAPT_PARAM= ( 0.5, 1.5, 1.0, 1.0E4, 0.001, 50 )
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 20

% --- 収束 ---
ITER= 40000
CONV_FIELD= RMS_DENSITY
CONV_RESIDUAL_MINVAL= -13
CONV_STARTITER= 100

% --- I/O ---
MESH_FILENAME= flat_plate_planar.su2
MESH_FORMAT= SU2
SOLUTION_FILENAME= solution_flow.dat
TABULAR_FORMAT= CSV
CONV_FILENAME= history
VOLUME_FILENAME= flow
SURFACE_FILENAME= surface_flow
OUTPUT_WRT_FREQ= 5000
SCREEN_OUTPUT= ( INNER_ITER, RMS_DENSITY, RMS_ENERGY, RMS_TKE, RMS_DISSIPATION, LIFT, DRAG )
HISTORY_OUTPUT= ( ITER, RMS_RES, AERO_COEFF )
OUTPUT_FILES= ( RESTART, PARAVIEW, SURFACE_CSV )
