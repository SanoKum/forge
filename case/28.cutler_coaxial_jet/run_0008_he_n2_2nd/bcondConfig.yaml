# 28.cutler_coaxial_jet — binary [He, N2] 組成依存超音速入口 (M5)
# 中心ジェット He / coflow N2, ともに Mach1.8, Ps=101325 Pa (圧力整合)。
# inlet_uniformVelocity は全状態固定入口 (超音速). Y0=He, Y1=N2 の組成を指定する。
axis:
  physID: 1
  kind: slip
  outputHDFflg: 0
  ints:
  floats:

jet_in:                     # 中心 He ジェット: Ts~144K, u~1271 m/s, ro~0.339
  physID: 2
  kind: inlet_uniformVelocity
  outputHDFflg: 0
  ints:
  floats:
    ro: 0.339
    Ux: 1271.0
    Uy: 0.0
    Uz: 0.0
    Ps: 101325.0
    k: 1.0
    omega: 1000.0
    Y0: 1.0                 # He
    Y1: 0.0                 # N2

lip:
  physID: 3
  kind: slip
  outputHDFflg: 0
  ints:
  floats:

coflow_in:                  # coflow N2: Ts~182K, u~495 m/s, ro~1.876
  physID: 4
  kind: inlet_uniformVelocity
  outputHDFflg: 0
  ints:
  floats:
    ro: 1.876
    Ux: 495.0
    Uy: 0.0
    Uz: 0.0
    Ps: 101325.0
    k: 1.0
    omega: 1000.0
    Y0: 0.0                 # He
    Y1: 1.0                 # N2

amb_in:
  physID: 5
  kind: slip
  outputHDFflg: 0
  ints:
  floats:

top:
  physID: 6
  kind: slip
  outputHDFflg: 0
  ints:
  floats:

outflow:
  physID: 7
  kind: outlet_statPress
  outputHDFflg: 0
  ints:
  floats:
    Ps: 101325.0
    Pt: 101325.0           # backflow (entrainment) 時の stagnation 圧 (未指定だと 0 → NaN)
    Tt: 300.0              # backflow 時の stagnation 温度
