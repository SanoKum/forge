# ② イソブタン風洞 **M6** (Pt 5 MPa, Tt 1550 K, φ=0.9, 出口/入口 1 m) — semi-perfect 設計 + TP CFD
# r_t = 0.5/√86.55 = 53.75 mm。出口 T 225 K (NASA-9 下限 200 K の上)。plan: plans/active/tooling-nozzle-m6-isobutane.md
# 入口配管径 1 m, Md=6。R と L (入口側 L_U・出口側 L_c)・knot Mach をスタディする。
# 軸 M 則は knot (A6): 単一 quintic は L_c ≤ 17.9 (R=3) に縛られ、M6 では壁角 θ_w > μ_w で
# 逆 MOC が fold (壁に Δθ 12° の折れ) → 全点 REJECT。knot なら L_c を 35–60 に伸ばせる。
# 生成物組成 (質量分率, 完全燃焼 + 過剰 O2, 解離なし = 1000 K では妥当):
#   C4H10 + 6.5/φ (O2 + 3.76 N2) → 4 CO2 + 5 H2O + 0.722 O2 + 27.16 N2
# 熱力学: NASA-9 (forge 内蔵 CEA 係数と同一) を frozen 組成で。γ は 1.2755 (スロート 1364 K) →
# 1.38 (出口 225 K) と変化する (semi-perfect が必須)。
name: isobutane_wt_m6_R3_LU12_Lc45_tp
type: wind_tunnel_axisym_axismach
gas:
  model: semiperfect
  species: {CO2: 0.1677, H2O: 0.0858, O2: 0.0220, N2: 0.7245}
  # 参照値 (semi-perfect では NASA-9 が優先。IC 用の初期推定と CPG フォールバック):
  gamma: 1.2755         # γ* (スロート 1364 K) 参照値
  cp: 1394.0

spec:
  Pt: 5.0e6
  Tt: 1550.0
  p_ambient: 2070.0     # M6 出口の整合静圧 (semi-perfect Tt=1550: P/Pt=4.14e-4 × 5 MPa)
  r_throat: 0.05375     # [m] 出口径 1 m から (semi-perfect Tt=1550: A/A*(M6) = 86.55)
  M_design: 6.0

dv:
  L_c: {value: 50.0, min: 20.0, max: 80.0}   # r_t 単位。全長 ≈ L_c + r_F/tan μ_d = L_c + 55 (基準点 R3/L_c50/M_K2.5)

geometry:
  R: 3.0
  r_inlet: 9.303        # 入口配管径 1 m / (2 r_t) = 9.30 r_t (収縮比 86.6)
  L_U: 12.0             # 収縮比 86.6 (Δr=8.3): μ=L_U²/(RΔr)≤20 → L_U ≤ 22。まず 12
  L_pipe: 0.5
  start_line: throat_char
  n_start: 41
  n_axis_inv: 1200      # M6 は場が x_end ≈ L_c+127 r_t まで伸びる → 平均軸間隔 0.15 r_t
  axis_dx0: 0.03        # スロート側の軸細分 (初項 0.03, 公比 1.05 で 0.15 まで)。粗いと壁の最初 0.3 r_t が ±2e-4 ジッタして QA 落ち
  x_end_margin: 2.3
  wall_mode: cplus
  exit_mode: characteristic
  axis_law: knot        # A6 区分 C² (quintic + 4 次)。DOF = L_c と M_knot
  M_knot: 2.5           # 急膨張の終わり (knot Mach)。プロトタイプでは 2.0–2.5 が θ_max 最小
  Lc_mode: explicit

mesh:
  discretization: node
  ni: 1100              # 全長 ~110 r_t (M4.2 の 34 r_t で 365) → ~10 セル/r_t を維持
  nj: 65
  wall_first_frac: 5.0e-3
  throat_refine: 3.0

evaluate:
  nStepOuter: 12000
  outStepInterval: 4000
  cfl_main: 2.0       # TP は cfl4 で本段爆発 (run_0001 初回)。mid 段 (2次 cfl1) を経て cfl2
  mid_stage: true
  # axis_r_floor: (不要)   # [m] axisRFloor (軸行 0 < 床 < 第一内点行 min 0.044 r_t=6 mm)。TP は nodeAxisDirichlet 不可 → 軸行真空化を床で抑える (run_0001 4 回目)
