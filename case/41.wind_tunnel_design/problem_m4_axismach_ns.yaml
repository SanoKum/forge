# ① 軸対称風洞 — A12 NS 本計算 (壁解像 y+~1.5, 低 Re SST)。壁 = cplus inviscid +
# δ* オフセット (v1=相関 / v2=CFD 抽出は --dstar-csv)。IC = coarse 中継から cross-mesh。
# plan: plans/active/tooling-nozzle-axismach-viscous-deltastar.md
# → 逆 MOC → 直管+U→T Hermite+骨接放物線+設計壁 (円弧なし) → node Euler 段階起動。
# L_c は Lc_mode: max (許容窓上限×0.98 — 単一 quintic では M''_A>0 のため
# 上限側が単調ゲートで縛られる。Hall アンカーで x_E≈9.6 となり B8 の 14 より短い)。
name: wt_m4_axismach_ns
type: wind_tunnel_axisym_axismach
gas: {gamma: 1.4, cp: 1004.5}

spec:
  Pt: 1.0e6          # 入口全圧 [Pa]
  Tt: 800.0          # 入口全温 [K]
  p_ambient: 6588.0  # M4 整合圧 (run_0028 の教訓)
  r_throat: 0.010    # スロート半径 [m]
  M_design: 4.0

dv:
  L_c: {value: 9.4, min: 1.0, max: 20.0}   # Lc_mode: explicit のときのみ使用

geometry:
  R: 2.0             # スロート曲率半径 / r_t (Hall のパラメータ + U→T Hermite の r''(T))
  r_inlet: 2.5
  L_U: 3.5           # U→T Hermite 長 (walldriven W1 と同値, μ=4.08 ≤ 20)
  L_pipe: 0.5
  M_start: 1.05      # starting line の軸 M (数値上の選択)
  n_start: 41
  n_axis_inv: 500
  x_end_margin: 2.3  # 軸 target 延長 = x_E + margin × r_F √(Md²−1)
  start_line: throat_char  # 初期値線 = スロート特性線 (A8)
  wall_mode: cplus         # 壁 = C⁺ 線上の質量流束閉包 (A10, 古典法)
  # n_axis 500 で設計 0.39 s / ‖ΔM‖∞ 0.240% Md (run_0056)。精度を優先するなら
  # n_axis_inv 2000 / n_start 121 で 2.6 s / 0.224% (run_0057)。
  exit_mode: characteristic
  Lc_mode: max       # 許容窓上限×0.98 (アンカー更新反復でも自動追従)

mesh:
  discretization: node
  # NS 壁解像 y+~1.5 (b8ns と同レシピ: frac 3e-5 は AR>1500 で FAIL、4.5e-5 で AR~880)
  ni: 561
  nj: 97
  wall_first_frac: 4.5e-5
  throat_refine: 3.0

evaluate:
  nStepOuter: 48000
  outStepInterval: 8000
  cfl_main: 1.0      # y+1.5 は cfl2/4 不可 (M4 低圧・出口コーナー, run_0030 実測)
