# ① 軸対称風洞 — A8 A/B の【本命】: 初期値線をスロート特性線 (CONTUR 流) にした
# pass0 (Hall アンカー)。壁は T から全域が MOC 出力 (骨接放物線区間なし)。
# plan: plans/active/tooling-nozzle-axismach-throat-characteristic.md
# 対照 = problem_m4_axismach_a8v.yaml (start_line: vertical)。両者の差分は
# geometry.start_line と ni (壁長に比例) のみ。
name: wt_m4_axismach_a8c
type: wind_tunnel_axisym_axismach
gas: {gamma: 1.4, cp: 1004.5}

spec:
  Pt: 1.0e6
  Tt: 800.0
  p_ambient: 1000.0
  r_throat: 0.010
  M_design: 4.0

dv:
  L_c: {value: 9.4, min: 1.0, max: 20.0}   # Lc_mode: max なので未使用

geometry:
  R: 2.0
  r_inlet: 2.5
  L_U: 3.5
  L_pipe: 0.5
  start_line: throat_char
  M_start: 1.05
  n_start: 121
  n_axis_inv: 2000
  x_end_margin: 2.3
  dx_wall: 0.005
  exit_mode: characteristic
  Lc_mode: max

mesh:
  discretization: node
  ni: 365     # 壁が x_F 22.88 と長い分だけ比例増 (対照 357 と軸解像度を揃える)
  nj: 65
  wall_first_frac: 5.0e-3
  throat_refine: 3.0

evaluate:
  nStepOuter: 12000
  outStepInterval: 4000
