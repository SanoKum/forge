# ① 軸対称風洞ノズル (モード F) — B8: 設計=B6 グローバル / 評価=B7 分割帳簿 (Md=4)
# problem_m4_cfdanchor.yaml との差分: throat_anchor_run を B6 壁の場
# (run_0018/pass_08) に更新 — 旧アンカー (run_0017 = Sauer 壁の波だらけの場) は
# 評価参照として不適で B7 の物理後退を隠した (plan §9.2 B8)
name: wt_m4_b8ns_coarse
type: wind_tunnel_axisym
gas: {gamma: 1.4, cp: 1004.5}

spec:
  Pt: 1.0e6          # 入口全圧 [Pa]
  Tt: 800.0          # 入口全温 [K]
  # NS では出口の亜音速境界層が背圧を読む (Euler/slip では未使用だった)。
  # 1000 Pa のままだと適正出口静圧 (M4: Pt/151.8 ≈ 6588 Pa) より大幅に低く、
  # 出口∩壁コーナーで吸い出し→roOmega NaN (run_0028 初回で実測)。整合圧に設定。
  p_ambient: 6588.0
  r_throat: 0.010    # スロート半径 [m]
  M_design: 4.0      # 設計マッハ (D_e は従属)

dv:
  L_ax:   {value: 14.0, min: 10.0, max: 20.0}   # 目標 Bézier の軸スパン / rt
  mc_cp1: {value: 2.0,  min: 1.3,  max: 3.0}    # 自由 CP (単調)
  mc_cp2: {value: 2.9,  min: 1.6,  max: 3.6}
  mc_cp3: {value: 3.6,  min: 2.0,  max: 3.95}

geometry:
  R: 2.0             # スロート円弧 (Ru=Rd 単一 — モード F)
  blend_len: 0.0     # 曲率ブレンド無効 (撤回済み — plan §9.1)
  r_inlet: 2.5
  L_pipe: 0.5
  L_contract: 3.0
  phi_u_deg: 25.0
  n_axis_inv: 500    # 逆マーチの軸解像度
  n_start: 41
  centerline_start_order: 2   # 目標 Bézier を M,M',M'' まで CFD アンカーに整合
  # アンカー抽出元 (凍結)。run_0017 pass_08 最終場 (PASS アンカー系列の最新)
  throat_anchor_run: "case/41.wind_tunnel_design/run_0018_cfd_anchor/pass_08"


mesh:
  # SST 中継段 (粗壁): y+~50-80 で低 Re SST は不正確だが安定。
  # 目的は y+1.5 本計算の IC となる「構造の正しい k/ω/BL 場」を作ること
  # (Euler 場+一様 k/ω から y+1.5 へ直接入ると 2 次化で出口コーナー ω NaN)。
  ni: 321
  nj: 65
  wall_first_frac: 5.0e-3
  throat_refine: 3.0

evaluate:
  nStepOuter: 12000
  outStepInterval: 4000
