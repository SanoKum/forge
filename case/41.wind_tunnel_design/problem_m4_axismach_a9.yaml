# ① 軸対称風洞 — A9: 壁を**断面の質量流束閉包**で決める (流線積分の置換) +
# 逆 MOC を粗く (n_axis 2000→500, dx_wall 0.005→0.02)。設計 33 s → 2.3 s。
# plan: plans/active/tooling-nozzle-moc-flux-closure-wall.md
# 対照 = run_0050 (problem_m4_axismach_a8c.yaml, n2000 流線)。壁・初期値線・
# アンカー (Hall pass0)・出口決定・メッシュは同一で、差分は上記 3 キーのみ。
name: wt_m4_axismach_a9
type: wind_tunnel_axisym_axismach
gas: {gamma: 1.4, cp: 1004.5}

spec:
  Pt: 1.0e6
  Tt: 800.0
  p_ambient: 1000.0
  r_throat: 0.010
  M_design: 4.0

dv:
  L_c: {value: 9.4, min: 1.0, max: 20.0}   # Lc_mode: max なので未使用

geometry:
  R: 2.0
  r_inlet: 2.5
  L_U: 3.5
  L_pipe: 0.5
  start_line: throat_char
  M_start: 1.05
  n_start: 41
  n_axis_inv: 500
  x_end_margin: 2.3
  dx_wall: 0.02
  wall_mode: flux      # 断面 ∫ρ(u·n)dA = ṁ* で壁を決める (A9)
  exit_mode: characteristic
  Lc_mode: max

mesh:
  discretization: node
  ni: 365     # 壁が x_F 22.88 と長い分だけ比例増 (対照 357 と軸解像度を揃える)
  nj: 65
  wall_first_frac: 5.0e-3
  throat_refine: 3.0

evaluate:
  nStepOuter: 12000
  outStepInterval: 4000
